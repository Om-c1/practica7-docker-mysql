services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servidor_web_php
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: servidor_bd_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: holamundo_db
      MYSQL_USER: usuario_app
      MYSQL_PASSWORD: password123
    volumes:
      - db-data:/var/lib/mysql
    restart: always

volumes:
  db-data: